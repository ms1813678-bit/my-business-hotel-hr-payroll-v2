<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — M.Y. Business Hotel HR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="logo">MY</div>
    <h1>نظام الموارد البشرية</h1>
    <p class="muted">فندق M.Y. Business — المعادي · Version 2.1</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div>
        <label for="username">اسم المستخدم</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>
      <div>
        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">دخول إلى النظام</button>
    </form>

    <p class="muted" style="margin-top:22px;font-size:12px;text-align:center;">
      يعمل محليًا فقط · لا يُرفع أي بيانات إلى الإنترنت
    </p>
  </div>
</body>
</html>
