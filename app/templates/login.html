<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>تسجيل الدخول — M.Y. Business Hotel HR V2</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0; display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
    .card { background:#1e293b; padding:2rem; border-radius:12px; width:100%; max-width:380px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
    h1 { margin:0 0 1.5rem; font-size:1.25rem; text-align:center; }
    label { display:block; margin-bottom:.35rem; font-size:.9rem; }
    input { width:100%; padding:.65rem .8rem; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; margin-bottom:1rem; box-sizing:border-box; }
    button { width:100%; padding:.75rem; border:none; border-radius:8px; background:#2563eb; color:white; font-weight:600; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    .error { background:#7f1d1d; color:#fecaca; padding:.6rem .8rem; border-radius:8px; margin-bottom:1rem; font-size:.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>M.Y. Business Hotel<br>نظام الموارد البشرية والرواتب — الإصدار 2</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>اسم المستخدم</label>
      <input name="username" required autocomplete="username">
      <label>كلمة المرور</label>
      <input type="password" name="password" required autocomplete="current-password">
      <button type="submit">دخول</button>
    </form>
  </div>
</body>
</html>
